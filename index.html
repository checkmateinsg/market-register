<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Market Register">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2b2420">
<meta name="robots" content="noindex,nofollow">
<title>Market Register</title>
<style>
:root{
  --bg:#f5f0e8; --ink:#2b2420; --muted:#7c7168; --card:#ffffff; --line:#e3d9cc;
  --accent:#b5532a; --accent-dark:#8f3f1e; --ok:#2f7d4f; --warn:#c0392b; --amber:#b36b00; --hh:#f2a900; --hh-dark:#a87300;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
input,select,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;cursor:pointer}

/* header */
header{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0;letter-spacing:.2px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:#faf7f2;border-radius:10px;padding:10px 16px;font-weight:600;font-size:16px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.spacer{flex:1}
.hhbtn{border:2px solid var(--line);background:#faf7f2;border-radius:999px;padding:10px 18px;font-weight:700;font-size:16px}
.hhbtn.on{background:var(--hh);border-color:var(--hh-dark);color:#3a2a00}
body.hh header{background:#fff6dc;border-bottom-color:var(--hh)}
.banner{background:#fdecea;color:#8a1f13;padding:8px 16px;font-size:14px;border-bottom:1px solid #f3c4bd}
.banner.bk{background:#fff1d6;color:#7a4a00;border-bottom-color:#f0d29a;font-weight:700;cursor:pointer}
.banner.hhr{background:#fff6dc;color:#5a3d00;border-bottom-color:var(--hh);font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.hhr button{border:1px solid var(--hh-dark);background:#fff;border-radius:8px;padding:8px 12px;font-weight:800}
.banner.hhr button.go{background:var(--hh);color:#3a2a00}
.banner.rf{background:#fdecea;font-weight:700;cursor:pointer}
.savestat{font-size:12px;line-height:1.3;text-align:right;color:var(--muted)}
.savestat b{font-size:13px}
.savestat.ok b{color:var(--ok)}
.savestat.warn b{color:#b36b00}
.savestat.bad b{color:var(--warn)}
.hhstrip{background:var(--hh);color:#3a2a00;text-align:center;font-weight:800;letter-spacing:1px;padding:6px;font-size:14px}

main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* register */
.register{display:grid;grid-template-columns:1fr 380px;gap:14px;padding:14px;height:100%;min-height:0}
.left{overflow:auto;min-height:0;padding-bottom:20px}
.drawer{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:4px;font-weight:700}
.drawer span{color:var(--muted);font-weight:600;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,#999);
  border-radius:14px;padding:12px 12px 10px;min-height:128px;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 1px 0 rgba(0,0,0,.04)}
.tile:active{transform:scale(.985);background:#fbf8f3}
.tile.out{opacity:.45}
.tn{font-weight:700;font-size:17px;line-height:1.15;padding-right:30px}
.tp{font-size:22px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{background:#f3ece1;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}
.chip:active{background:#e8dccb}
.tdeals{font-size:12px;font-weight:700;color:var(--muted,#7a6a5a);margin-top:2px}
.picklist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pickopt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:16px 16px;border-radius:12px;border:1px solid var(--line);background:#faf7f2;font-size:18px;font-weight:700;text-align:left}
.pickopt:active{background:#e8dccb}
.pickopt small{display:block;font-size:13px;font-weight:500;opacity:.75;margin-top:2px}
.pickopt.bun{background:#eef7f1;border-color:#bfe0cb}
.pickopt.dis{opacity:.4}
.stock{margin-top:auto;font-size:13px;color:var(--muted);font-weight:600}
.stock.low{color:var(--warn)}
.qtybadge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;min-width:30px;height:30px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;padding:0 8px}
h3.sec{margin:18px 2px 8px;font-size:14px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.bundles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bundle{background:#fff;border:2px dashed var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.bundle:active{background:#fbf8f3}
.bundle.info{border-style:solid;border-color:var(--line);border-left:6px solid var(--accent)}
.bundle.info:active{background:#fff}
.bundle .bn{font-weight:800;font-size:16px}
.bundle .bi{font-size:14px;color:var(--muted)}
.bundle .bp{font-weight:800;font-size:20px;color:var(--accent-dark)}

.order{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.order h2{margin:0;padding:14px 16px 8px;font-size:18px}
.olist{flex:1;overflow:auto;padding:0 16px 8px;min-height:60px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0e9de}
.row .nm{flex:1;font-weight:600}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#faf7f2;font-size:22px;font-weight:700;line-height:1}
.step span{min-width:24px;text-align:center;font-weight:800;font-size:18px}
.pl{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
.pl.deal{color:var(--ok);font-weight:700}
.pl.muted{color:var(--muted)}
.pl.adj{color:var(--amber);font-weight:700}
.hint{margin:6px 0;background:#eef7f1;border:1px solid #bfe0cb;color:#1d5a37;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
.hint button{margin-top:6px;background:var(--ok);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:700}
.ofoot{border-top:1px solid var(--line);padding:10px 16px 12px;background:#fcfaf6;max-height:64%;display:flex;flex-direction:column;min-height:0}
.ofs{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.ofoot>.btnrow{padding-top:8px}
.cardbox{background:#e8f1fb;border:1px solid #b6d0ee;color:#17406e;border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px;line-height:1.35}
.cardbox b{font-size:18px}
.cardbox span{color:#456;font-size:13px}
.cardbox button{display:block;margin-top:8px;width:100%;padding:9px;border-radius:8px;border:1px solid #b6d0ee;background:#fff;font-weight:700}
.cardbox button.on{background:#c0392b;color:#fff;border-color:#c0392b}
.cashbox{background:#eef7f1;border:1px solid #bfe0cb;border-radius:10px;padding:8px;margin-bottom:10px}
.tbs{display:flex;gap:6px;flex-wrap:wrap}
.tbs button{flex:1;min-width:56px;padding:10px 4px;border-radius:8px;border:1px solid #bfe0cb;background:#fff;font-weight:800}
.tbs button.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.cashbox input{width:100%;margin-top:6px;padding:10px;border:1px solid #bfe0cb;border-radius:8px;font-size:16px}
.chg{margin-top:6px;font-size:16px;font-weight:700;color:#1d5a37}
.chg b{font-size:22px}
.chg.short{color:var(--warn)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;font-weight:900;margin-bottom:8px}
.total small{font-size:14px;font-weight:600;color:var(--ok)}
.total small.am{color:var(--amber)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.pay button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#faf7f2;font-weight:700}
.pay button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btnrow{display:flex;gap:8px}
.mini{margin-bottom:10px;align-items:stretch}
.mini .ghost{padding:10px 12px;font-size:14px;border-radius:10px;white-space:nowrap}
.mini input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff}
.big{flex:1;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:800;color:#fff;background:var(--ok)}
.big:disabled{background:#b9b2a8}
.ghost{border:1px solid var(--line);background:#faf7f2;border-radius:14px;padding:18px 16px;font-weight:700}

/* panels */
.page{padding:16px;max-width:1100px;margin:0 auto;padding-bottom:60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:26px;font-weight:900;margin-top:2px}
.stat .v.pos{color:var(--ok)}
.stat .v.neg{color:var(--warn)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #f0e9de;vertical-align:top}
th{background:#faf6ef;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input.cnt{width:70px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:16px;text-align:right}
.tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800}
.tag.hh{background:var(--hh);color:#3a2a00}
.tag.reg{background:#e6e0d6;color:#4b4238}
.tag.void{background:#f3c4bd;color:#8a1f13}
.tag.adj{background:#ffe9b8;color:#6a4300}
.tag.rf{background:#c0392b;color:#fff}
.sbtn{border:1px solid var(--line);background:#faf7f2;border-radius:10px;padding:10px 14px;font-weight:700;margin:2px 4px 2px 0}
.sbtn.danger{color:var(--warn);border-color:#f0c4be}
.sbtn.pri{background:var(--accent);color:#fff;border-color:var(--accent-dark)}
.sbtn.pool.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sbtn.sm{padding:6px 10px;font-size:13px}
select.day{padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.frm label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.frm input,.frm select{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);min-width:0}
.irow{display:flex;gap:8px;align-items:center;margin-top:8px}
.irow select{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.irow input{width:70px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.note{font-size:13px;color:var(--muted);margin:4px 0 10px}
.mg{font-size:13px;margin-top:8px;font-weight:600;color:var(--ok)}
.mg.amber{color:var(--amber)}
.mg.bad{color:var(--warn);font-weight:800}
.dtype{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:#efe7da;border-radius:999px;padding:2px 8px;color:#5a4a38;margin-bottom:6px}
.ok{color:var(--ok)} .bad{color:var(--warn)} .amb{color:var(--amber)}
.diff{font-weight:800}

.page.tight{padding-top:10px;padding-bottom:30px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar .sbtn{margin:0;padding:8px 12px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.stat.sm{padding:8px 10px;border-radius:12px}
.stat.sm .v{font-size:20px;margin-top:0}
.line{font-size:13px;color:var(--muted);margin:8px 2px 0;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.two h3.sec{margin:10px 2px 6px}
table.cmp{font-size:14px}
table.cmp th,table.cmp td{padding:6px 8px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;margin:10px 0 12px}
.seg button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:#faf7f2;font-weight:800;font-size:17px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* pin */
.pinwrap{max-width:320px;margin:30px auto;text-align:center}
.pinwrap h2{margin:0 0 6px}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.f{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:64px;font-size:26px;font-weight:700;border-radius:14px;border:1px solid var(--line);background:#fff}
.keys button:active{background:#e8dccb}
.pinmsg{color:var(--warn);font-weight:700;min-height:22px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:14px;padding:10px}

/* toast + modal */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;
  padding:12px 16px;display:none;gap:12px;align-items:center;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;font-weight:600}
#toast button{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font-weight:800}
#modal,#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#modal .box,#sheet .box{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
#modal p{margin:0 0 16px;font-size:17px;line-height:1.35}
#sheet h3{margin:0 0 10px;font-size:20px}
#sheet .lbl{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
#sheet .opts{display:flex;gap:6px;flex-wrap:wrap}
#sheet .opts button{flex:1;min-width:90px;padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:#faf7f2;font-weight:700}
#sheet .opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#sheet input.amt{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:20px}

@media (max-width:820px){
  .register{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,60%)}
}
</style>
</head>
<body>
<header>
  <h1>Market Register</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <div id="savestat" class="savestat"></div>
  <button class="hhbtn" id="hhbtn" data-act="togglehh"></button>
</header>
<div id="banner"></div>
<div id="hhstrip"></div>
<main id="main"></main>
<div id="toast"></div>
<div id="modal"><div class="box"><p id="mtext"></p><div class="btnrow"><button class="ghost" data-act="mno">Cancel</button><button class="big" style="background:var(--warn)" data-act="myes">Yes</button></div></div></div>
<div id="sheet"><div class="box" id="sheetbox"></div></div>

<script>
(function(){
'use strict';
var KEY='market_register_v1';   // same key as v1 so saved data carries over; migrate() upgrades it
var COLORS=['#b5532a','#d98e04','#4f7a3a','#7b4b94','#2a6f97','#c2547a','#5d6d7e','#a0522d','#1f8a70','#8e5b3a'];
var KEY_PREV=KEY+'_prev';
var REASONS=['Sample','Friend','Damaged','Other'];
var storageOK=true;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ storageOK=false; }
var store={ls:storageOK?null:false,idb:null,persist:null};

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(c){c=Math.round(c);return (c<0?'-':'')+'$'+(Math.abs(c)/100).toFixed(2);}
function moneyShort(c){return (c%100===0)?'$'+(c/100):money(c);}
function dollarsStr(c){return (c==null)?'':(c/100).toFixed(2);}
function parseCents(v){v=String(v==null?'':v).replace(/[^0-9.]/g,'');if(v==='')return null;var n=parseFloat(v);return isNaN(n)?null:Math.round(n*100);}
function uid(p){return p+Math.random().toString(36).slice(2,8);}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function dayLabel(t){return new Date(t).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});}
function timeLabel(t){return new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function today(){return dayKey(Date.now());}

/* ---------- state ---------- */
function defaultState(){
  var P=[
    {id:'p_cookie',name:'Cookies (bag of 3)',section:'Baked',stock:19,price:{reg:450,hh:300}},
    {id:'p_butter',name:'Butter (4 oz jar)',section:'Dairy',stock:22,price:{reg:500,hh:350}},
    {id:'p_bm',name:'Buttermilk (12 oz)',section:'Dairy',stock:5,price:{reg:400,hh:275}},
    {id:'p_vs',name:'Vanilla Sugar (4 oz)',section:'Pantry',stock:11,price:{reg:600,hh:450}},
    {id:'p_shot',name:'Wellness Shot',section:'Drinks',stock:18,price:{reg:400,hh:300}},
    {id:'p_banana',name:'Banana Bread (mini)',section:'Baked',stock:16,price:{reg:400,hh:275}}
  ];
  P.forEach(function(p,i){p.color=COLORS[i%COLORS.length];});
  var D=[
    {id:'d1',type:'set',name:'',items:[{pid:'p_cookie',qty:2}],price:{reg:800,hh:500}},
    {id:'d2',type:'set',name:'',items:[{pid:'p_cookie',qty:3}],price:{reg:1100,hh:null}},
    {id:'d3',type:'set',name:'',items:[{pid:'p_butter',qty:2}],price:{reg:900,hh:600}},
    {id:'d4',type:'set',name:'',items:[{pid:'p_butter',qty:3}],price:{reg:1200,hh:800}},
    {id:'d5',type:'set',name:'',items:[{pid:'p_bm',qty:2}],price:{reg:700,hh:500}},
    {id:'d6',type:'set',name:'',items:[{pid:'p_vs',qty:2}],price:{reg:1100,hh:800}},
    {id:'d7',type:'set',name:'',items:[{pid:'p_vs',qty:3}],price:{reg:1500,hh:null}},
    {id:'d8',type:'set',name:'',items:[{pid:'p_shot',qty:3}],price:{reg:1000,hh:700}},
    {id:'d10',type:'set',name:'',items:[{pid:'p_banana',qty:3}],price:{reg:1000,hh:null}},
    {id:'d9',type:'set',name:'Sampler',items:[{pid:'p_butter',qty:1},{pid:'p_cookie',qty:1},{pid:'p_vs',qty:1}],price:{reg:1300,hh:1000}}
  ];
  return migrate({v:2,products:P,deals:D,orders:[],cart:{},mode:'reg',pay:'Cash',nextOrder:1,lastBackup:null,sqOffline:false});
}
// Upgrades any older saved/backup data to the current shape. Never throws away sales.
function migrate(s){
  if(!s||!s.products||!s.deals)return null;
  var secMap={p_cookie:'Baked',p_butter:'Dairy',p_bm:'Dairy',p_vs:'Pantry',p_shot:'Drinks',p_banana:'Baked'};
  s.products.forEach(function(p,i){
    if(!p.section)p.section=secMap[p.id]||'Items';

/* ---------- pricing engine (all values in cents) ---------- */
function prod(id){for(var i=0;i<state.products.length;i++){if(state.products[i].id===id)return state.products[i];}return null;}

function dealName(d){

  var t=d.type||'set';
  if(t==='mix')return 'Mix & match: any '+d.qty;
  if(t==='pair'){var a=prod(d.a),b=prod(d.b);return (a?a.name:'?')+' + '+(b?b.name:'?');}
  var parts=d.items.map(function(it){var p=prod(it.pid);return (it.qty>1?it.qty+' ':'')+(p?p.name:'?');});
  return parts.join(' + ');
}
function dealLabel(d,mode){

// every multiset of size n drawn from pids -> [{pid,qty}...]
function combos(pids,n){
  var out=[];
  (function rec(i,left,cur){
    if(left===0){out.push(cur.slice());return;}
    if(i>=pids.length)return;
    for(var k=left;k>=0;k--){
      var nx=cur.slice();if(k>0)nx.push({pid:pids[i],qty:k});
      rec(i+1,left-k,nx);
    }
  })(0,n,[]);

}
// Turns every kind of deal (set, mix & match, pair) into plain "these items for this price" rows for the engine.
function expandedDeals(mode){
  var out=[];
  state.deals.forEach(function(d){
    var t=d.type||'set',nm=dealName(d);
    if(t==='set'){
      if(d.price[mode]!=null&&d.items.length>0&&d.items.every(function(it){return prod(it.pid)&&it.qty>0;}))
        out.push({id:d.id,name:nm,items:d.items,p:d.price[mode]});

      var pids=(d.pids||[]).filter(function(x){return prod(x);}).slice(0,8),n=Math.max(1,Math.min(5,d.qty||1));

function priceCart(cart,mode){
  mode=mode||state.mode;
  var pids=Object.keys(cart).filter(function(k){return cart[k]>0&&prod(k);});
  var deals=expandedDeals(mode).filter(function(d){return d.items.every(function(it){return (cart[it.pid]||0)>=it.qty;});});
  var memo={};
  function rec(i,rem){
    var key=i+'|'+pids.map(function(p){return rem[p];}).join(',');
    if(memo[key])return memo[key];
    var res;
    if(i===deals.length){
      var c=0;pids.forEach(function(p){c+=rem[p]*single(prod(p),mode);});
      res={cost:c,picks:[]};
    }else{
      var d=deals[i],maxk=Infinity;
      d.items.forEach(function(it){maxk=Math.min(maxk,Math.floor(rem[it.pid]/it.qty));});
      var best=null;
      for(var k=maxk;k>=0;k--){
        var r2={};for(var q in rem)r2[q]=rem[q];
        d.items.forEach(function(it){r2[it.pid]-=it.qty*k;});
        var sub=rec(i+1,r2);

      }

    }
    memo[key]=res;return res;

  var r=rec(0,rem0);
  var lines=[],rem={};pids.forEach(function(p){rem[p]=cart[p];});
  deals.forEach(function(d,i){
    var k=r.picks[i]||0;if(k<=0)return;
    var units={};d.items.forEach(function(it){units[it.pid]=(units[it.pid]||0)+it.qty*k;rem[it.pid]-=it.qty*k;});
    // merge with an earlier line from the same deal (mix & match can use several combinations)

  });

    if(rem[p]>0){var pr=prod(p);lines.push({kind:'single',pid:p,name:pr.name,qty:rem[p],amount:rem[p]*single(pr,mode),units:(function(){var u={};u[p]=rem[p];return u;})()});}
  });

function cartCount(){var n=0;for(var k in state.cart)n+=state.cart[k];return n;}
function hints(pr){
  if(!cartCount())return [];
  var out=[];
  state.products.forEach(function(p){
    var have=state.cart[p.id]||0; if(p.stock<have+1)return;
    var c2={};for(var k in state.cart)c2[k]=state.cart[k];c2[p.id]=have+1;
    var t2=priceCart(c2).total, delta=t2-pr.total, s=single(p);
    if(s-delta>=50){
      var bname=null;   // name the bundle this item completes, if any
      state.deals.forEach(function(d){
        if(bname||d.type!=='set'||!d.name)return;
        var needs=false,okAfter=true,okBefore=true;
        d.items.forEach(function(it){
          if(it.pid===p.id)needs=true;
          if((c2[it.pid]||0)<it.qty)okAfter=false;
          if((state.cart[it.pid]||0)<it.qty)okBefore=false;
        });
        if(needs&&okAfter&&!okBefore)bname=d.name;
      });
      out.push({pid:p.id,name:p.name,delta:delta,save:s-delta,have:have,bundle:bname});

function finalOf(pr){

    offline:isCard&&!!state.sqOffline,adj:fin.adj?{type:fin.adj.type,reason:fin.adj.reason}:null,
    note:ui.note.trim(),tender:tender,change:change,refundNeeded:false};

function voidOrder(id){

/* ---------- reports ---------- */
function report(day){
  day=day||ui.day;
  var orders=state.orders.filter(function(o){return !o.voided&&(day==='all'||dayKey(o.t)===day);});
  var R={orders:orders,count:orders.length,revenue:0,units:0,byMode:{reg:{n:0,rev:0},hh:{n:0,rev:0}},mix:{},prod:{},pay:{},
    card:{n:0,gross:0,off:{n:0,amt:0}},adj:{n:0,total:0,byReason:{}},cashSales:0};
  orders.forEach(function(o){
    R.revenue+=o.total;R.byMode[o.mode].n++;R.byMode[o.mode].rev+=o.total;
    if(o.pay==='Card'){R.card.n++;R.card.gross+=o.total;if(o.offline){R.card.off.n++;R.card.off.amt+=o.total;}}
    R.pay[o.pay]=(R.pay[o.pay]||0)+o.total;
    var given=(o.listTotal!=null?o.listTotal:o.total)-o.total;
    if(given>0){R.adj.n++;R.adj.total+=given;var rs=(o.adj&&o.adj.reason)||'Other';R.adj.byReason[rs]=(R.adj.byReason[rs]||0)+given;}
    for(var pid in o.units){
      R.units+=o.units[pid];var p=prod(pid);
      var e=R.prod[pid]||(R.prod[pid]={name:(p?p.name:(o.names&&o.names[pid])||pid),units:0,rev:0});e.units+=o.units[pid];
    }
    o.lines.forEach(function(l){
      var key=l.kind==='deal'?'D:'+l.name:'S';
      var m=R.mix[key]||(R.mix[key]={label:l.kind==='deal'?l.name:'Sold singly (no deal)',kind:l.kind,times:0,units:0,rev:0});
      m.times+=(l.kind==='deal'?l.count:l.qty);
      var u=0;for(var q in l.units)u+=l.units[q];m.units+=u;m.rev+=l.amount;
      var basis=0;for(var q2 in l.units){var pp=prod(q2);basis+=l.units[q2]*(pp?pp.price.reg:1);}
      for(var q3 in l.units){var pp2=prod(q3);var share=basis?(l.units[q3]*(pp2?pp2.price.reg:1))/basis:0;
        if(R.prod[q3])R.prod[q3].rev+=l.amount*share;}
    });
  });
  R.cashSales=R.pay.Cash||0;
  return R;
}
function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(){
  var rows=[['Order','Date','Time','Mode','Payment','Status','Sold as','Item / deal','Qty or times','Line amount','List total','Order total','Adjustment','Adj reason','Square offline','Cash given','Change','Refund in Square','Note']];
  state.orders.forEach(function(o){
    var given=(o.listTotal!=null?o.listTotal:o.total)-o.total;
    o.lines.forEach(function(l){
      rows.push([o.id,dayLabel(o.t),timeLabel(o.t),o.mode==='hh'?'Happy Hour':'Regular',o.pay,o.voided?'VOIDED':'ok',
        l.kind==='deal'?'Deal':'Single',l.name,l.kind==='deal'?l.count:l.qty,(l.amount/100).toFixed(2),((o.listTotal!=null?o.listTotal:o.total)/100).toFixed(2),(o.total/100).toFixed(2),
        given>0?(given/100).toFixed(2):'',(o.adj&&o.adj.reason)||'',o.offline?'yes':'',
        o.tender!=null?(o.tender/100).toFixed(2):'',o.change!=null?(o.change/100).toFixed(2):'',o.refundNeeded?'NEEDS REFUND':'',o.note||'']);
    });
  });
  return rows.map(function(r){return r.map(csvEsc).join(',');}).join('\n');
}
function download(name,text,type){
  try{
    var blob=new Blob([text],{type:type});var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
  }catch(e){toast('Download not available. Use Copy instead.');}
}

// Opens the iPad share sheet (Save to Files, AirDrop, Mail...). Falls back to a normal download.
function shareFile(name,text,type,onDone){
  var file=null;try{file=new File([text],name,{type:type});}catch(e){}
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(function(){if(onDone)onDone();},function(err){
      if(err&&err.name==='AbortError'){toast('Backup cancelled, nothing saved');}
      else{download(name,text,type);if(onDone)onDone();}});
  }else{download(name,text,type);if(onDone)onDone();}
}

function copyText(text){
  function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');toast('Copied');}catch(e){toast('Copy failed');}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Copied');},fallback);}else fallback();
}

function viewClose(){

    var bun=state.deals.filter(function(d){return (d.type||'set')==='set'&&d.name&&d.price[md]!=null&&d.items.length>1&&d.items.some(function(it){return it.pid===pp.id;})&&d.items.every(function(it){return prod(it.pid);});})
      .map(function(d){return '<button class="pickopt bun" data-act="pickbundle" data-id="'+d.id+'"><span>'+esc(d.name)+'<small>'+d.items.map(function(it){return esc(prod(it.pid).name);}).join(' + ')+'</small></span><b>'+money(d.price[md])+'</b></button>';}).join('');
    h='<h3>'+esc(pp.name)+'</h3><div class="note">'+(avail<=0?'Sold out. Fix the count in Settings if that is wrong.':avail+' left'+(inCart?' &middot; '+inCart+' already in this order':''))+'</div>'+

  }else if(ui.sheet==='start'){

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  var l=document.querySelector('.left');render._ls=l?l.scrollTop:0;
  switch(a){
    case 'tab':
      if(ui.tab==='settings'&&el.getAttribute('data-t')!=='settings'){ui.unlocked=false;ui.pin='';ui.pinFirst=null;ui.pinMsg='';}
      ui.tab=el.getAttribute('data-t');render();break;
    case 'toggleorders':ui.showOrders=!ui.showOrders;render();break;
    case 'rtab':ui.rtab=el.getAttribute('data-v');render();break;
    case 'gosales':ui.tab='sales';render();break;
    case 'togglehh':state.mode=state.mode==='hh'?'reg':'hh';state.hhDay=today();ui.tender=null;ui.tenderExact=false;save();render();break;
    case 'hhon':state.mode='hh';state.hhDay=today();save();render();break;
    case 'hhsnooze':ui.hhSnooze=Date.now()+10*60000;renderBanner();break;
    case 'hhdismiss':state.hhDismissDay=today();save();renderBanner();break;
    case 'add':if(addToCart(id,1)){afterCart();}else render();break;
    case 'pick':ui.pickId=id;ui.sheet='pick';renderSheet();break;
    case 'pickadd':ui.sheet=null;if(addToCart(id,parseInt(el.getAttribute('data-n'),10))){afterCart();}else render();break;
    case 'pickbundle':ui.sheet=null;var pb=state.deals.filter(function(x){return x.id===id;})[0];
      if(pb){var need={};pb.items.forEach(function(it){need[it.pid]=(need[it.pid]||0)+it.qty;});
        var short=Object.keys(need).filter(function(k){var p=prod(k);return !p||(state.cart[k]||0)+need[k]>p.stock;});
        if(short.length){toast('Not enough '+(prod(short[0])?prod(short[0]).name:'stock')+' for '+pb.name);render();break;}
        Object.keys(need).forEach(function(k){state.cart[k]=(state.cart[k]||0)+need[k];});}
      afterCart();break;
    case 'addn':if(addToCart(id,parseInt(el.getAttribute('data-n'),10))){afterCart();}else render();break;
    case 'addbundle':
      var d=state.deals.filter(function(x){return x.id===id;})[0];var ok=true;
      d.items.forEach(function(it){if(ok&&!addToCart(it.pid,it.qty))ok=false;});afterCart();break;
    case 'inc':if(addToCart(id,1)){afterCart();}else render();break;
    case 'dec':state.cart[id]=(state.cart[id]||0)-1;if(state.cart[id]<=0)delete state.cart[id];afterCart();break;
    case 'pay':state.pay=el.getAttribute('data-m');ui.tender=null;ui.tenderExact=false;save();render();break;
    case 'tender':
      var tv=el.getAttribute('data-v');
      if(tv==='exact'){ui.tenderExact=true;ui.tender=null;}else{ui.tenderExact=false;ui.tender=parseInt(tv,10);}
      render();break;
    case 'sqoff':state.sqOffline=!state.sqOffline;save();render();break;
    case 'clear':state.cart={};resetSale();save();render();break;
    case 'complete':completeSale();break;
    case 'undo':var lo=lastOrder();if(lo){voidOrder(lo.id);toast('Sale #'+lo.id+' undone'+(lo.pay==='Card'?'. Check Square for a refund.':''));}break;
    case 'void':
      var oid=parseInt(id,10);
      confirmBox('Void order #'+oid+'? Items go back into stock.',function(){voidOrder(oid);});break;
    case 'refunddone':case 'refundnot':
      state.orders.forEach(function(o){if(o.id===parseInt(id,10)){o.refundNeeded=false;o.refundNote=(a==='refunddone'?'Refunded in Square':'Card was never charged');}});save();render();break;
    case 'opensheet':
      ui.sheet=el.getAttribute('data-s');
      if(ui.sheet==='adjust'){ui.draft=ui.adj?{type:ui.adj.type,reason:ui.adj.reason,amt:ui.adj.amt}:{type:'comp',reason:null,amt:''};}
      renderSheet();break;
    case 'sheetclose':ui.sheet=null;renderSheet();break;
    case 'adjtype':ui.draft.type=el.getAttribute('data-v');renderSheet();break;
    case 'adjreason':ui.draft.reason=el.getAttribute('data-v');renderSheet();break;
    case 'adjapply':
      var dr=ui.draft;
      if(!dr.reason){toast('Pick a reason first');break;}
      if(dr.type!=='comp'){var av=parseCents(dr.amt);if(!av){toast('Type an amount');break;}}
      ui.adj={type:dr.type,reason:dr.reason,amt:dr.amt};ui.sheet=null;ui.tender=null;ui.tenderExact=false;render();break;
    case 'adjremove':ui.adj=null;ui.sheet=null;ui.tender=null;ui.tenderExact=false;render();break;
    case 'startsave':
      var sv=document.querySelector('[data-f="startamt"]');dayRec(today()).start=sv?parseCents(sv.value):null;ui.sheet=null;save();render();break;
    case 'csv':shareFile(backupName('csv'),buildCSV(),'text/csv',null);break;
    case 'csvcopy':copyText(buildCSV());break;
    case 'backup':backupNow();break;
    case 'sumcopy':
      var R=report();var txt='Market sales summary ('+(ui.day==='all'?'all days':ui.day)+')\nRevenue '+money(R.revenue)+'\nOrders '+R.count+'\nItems sold '+R.units+'\nGiven away '+money(R.adj.total)+'\n';
      Object.keys(R.mix).forEach(function(k){var m=R.mix[k];txt+=m.label+': '+m.times+' = '+money(m.rev)+'\n';});copyText(txt);break;
    case 'cosum':copyText(closeSummary(ui.coDay||today()));break;
    case 'applycounts':
      var n=0;var rc=dayRec(ui.coDay||today());
      state.products.forEach(function(p){if(rc.counts[p.id]!=null){p.stock=rc.counts[p.id];n++;}});
      save();render();toast(n?'Stock updated to your counts':'Type counts first');break;
    case 'closeday':
      dayRec(ui.coDay||today()).closedAt=Date.now();save();render();backupNow();break;
    case 'pk':
      var dg=el.getAttribute('data-d');
      if(dg==='bk')ui.pin=ui.pin.slice(0,-1);else if(ui.pin.length<4)ui.pin+=dg;
      if(ui.pin.length===4)handlePin();
      render();break;
    case 'forgotpin':
      confirmBox('Reset the PIN? Your sales and settings are kept. You will pick a new PIN.',function(){state.pin=null;ui.pin='';ui.pinMsg='';ui.pinFirst=null;save();render();});break;
    case 'changepin':
      confirmBox('Change the PIN? You will be asked to create a new one.',function(){state.pin=null;ui.unlocked=false;ui.pin='';ui.pinFirst=null;ui.pinMsg='';save();render();});break;
    case 'addprod':
      state.products.push({id:uid('p_'),name:'New item',section:'Items',stock:0,price:{reg:500,hh:null},color:COLORS[state.products.length%COLORS.length]});save();render();break;
    case 'mvprod':
      var ix=-1;state.products.forEach(function(p,i){if(p.id===id)ix=i;});var to=ix+parseInt(el.getAttribute('data-dir'),10);
      if(ix>=0&&to>=0&&to<state.products.length){var tmp=state.products[ix];state.products[ix]=state.products[to];state.products[to]=tmp;save();}render();break;
    case 'delprod':
      confirmBox('Delete this product? Deals that use it are updated too. Past sales are kept.',function(){
        state.products=state.products.filter(function(p){return p.id!==id;});
        state.deals.forEach(function(d){
          if((d.type||'set')==='set')d.items=d.items.filter(function(it){return it.pid!==id;});
          else if(d.type==='mix')d.pids=(d.pids||[]).filter(function(x){return x!==id;});
        });
        state.deals=state.deals.filter(function(d){
          var t=d.type||'set';
          if(t==='set')return d.items.length>0;
          if(t==='mix')return d.pids.length>0;
          return d.a!==id&&d.b!==id;});
        delete state.cart[id];save();render();});break;
    case 'adddeal':
      if(!state.products.length)break;
      state.deals.push({id:uid('d_'),type:'set',name:'',items:[{pid:state.products[0].id,qty:2}],price:{reg:0,hh:null}});save();render();break;
    case 'addmix':
      if(!state.products.length)break;
      state.deals.push({id:uid('d_'),type:'mix',name:'',qty:3,pids:state.products.map(function(p){return p.id;}).slice(0,8),price:{reg:0,hh:null}});save();render();break;
    case 'addpair':
      if(state.products.length<2){toast('Add at least 2 products first');break;}
      state.deals.push({id:uid('d_'),type:'pair',name:'',a:state.products[0].id,b:state.products[1].id,off:{reg:100,hh:null},price:{reg:0,hh:null}});save();render();break;
    case 'mixtoggle':
      state.deals.forEach(function(d){if(d.id===id){var p=el.getAttribute('data-p'),i2=(d.pids||[]).indexOf(p);
        if(i2>=0)d.pids.splice(i2,1);else if(d.pids.length<8)d.pids.push(p);else toast('Max 8 items in a group');}});save();render();break;
    case 'deldeal':state.deals=state.deals.filter(function(d){return d.id!==id;});save();render();break;
    case 'additem':
      state.deals.forEach(function(d){if(d.id===id)d.items.push({pid:state.products[0].id,qty:1});});save();render();break;
    case 'delitem':
      var di=parseInt(el.getAttribute('data-i'),10);
      state.deals.forEach(function(d){if(d.id===id)d.items.splice(di,1);});save();render();break;
    case 'resetsales':
      confirmBox('Clear all sales and put everything back in stock?',function(){
        state.orders.forEach(function(o){if(!o.voided)for(var pid in o.units){var p=prod(pid);if(p)p.stock+=o.units[pid];}});
        state.orders=[];state.nextOrder=1;state.days={};save();render();toast('Sales cleared');});break;
    case 'resetall':
      confirmBox('Reset everything to the starting setup? This deletes all sales and settings (the PIN stays).',function(){
        var pin=state.pin;state=defaultState();state.pin=pin;ui.day='all';resetSale();save();render();toast('Reset done');});break;
    case 'myes':$('#modal').style.display='none';if(modalFn){var f=modalFn;modalFn=null;f();}break;
    case 'mno':$('#modal').style.display='none';modalFn=null;break;
  }
});
// typing in these fields must not re-render the page (it would steal focus)
document.addEventListener('input',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-f');if(!f)return;
  if(f==='note')ui.note=el.value;
  else if(f==='adjamt'&&ui.draft)ui.draft.amt=el.value;
  else if(f==='tenderamt'){ui.tenderExact=false;ui.tender=parseCents(el.value);updateChange();
    var bs=document.querySelectorAll('.tbs button.on');for(var i=0;i<bs.length;i++)bs[i].className='';}
});
document.addEventListener('change',function(e){
  var el=e.target;var f=el.getAttribute&&el.getAttribute('data-f');if(!f)return;
  var id=el.getAttribute('data-id'),k=el.getAttribute('data-k');
  if(f==='note'||f==='adjamt'||f==='tenderamt'||f==='startamt')return;
  if(f==='day'){ui.day=el.value;render();return;}
  if(f==='coday'){ui.coDay=el.value;render();return;}
  if(f==='restore'){
    var file=el.files&&el.files[0];if(!file)return;var r=new FileReader();
    r.onload=function(){try{var s=migrate(JSON.parse(r.result));if(!s)throw 0;state=s;save();render();toast('Backup restored');}catch(x){toast('That file is not a valid backup');}};
    r.readAsText(file);return;
  }
  if(f==='hhstart'){state.hhStart=el.value||'';state.hhDismissDay=null;}
  else if(f==='co'){
    var rec=dayRec(ui.coDay||today());rec[k]=parseCents(el.value);
  }else if(f==='cocount'){
    var rc=dayRec(ui.coDay||today());var cn=parseInt(el.value,10);
    if(isNaN(cn)||cn<0)delete rc.counts[id];else rc.counts[id]=cn;
  }else if(f==='prod'){
    var p=prod(id);if(!p)return;
    if(k==='name')p.name=el.value.trim()||p.name;
    else if(k==='section')p.section=el.value.trim()||'Items';
    else if(k==='reg'){var c=parseCents(el.value);if(c!=null)p.price.reg=c;}
    else if(k==='hh'){p.price.hh=parseCents(el.value);}
    else if(k==='stock'){var n=parseInt(el.value,10);p.stock=isNaN(n)||n<0?0:n;}
  }else if(f==='deal'){
    var d=state.deals.filter(function(x){return x.id===id;})[0];if(!d)return;
    if(k==='name')d.name=el.value;
    else if(k==='reg'){var c2=parseCents(el.value);d.price.reg=c2==null?0:c2;}
    else if(k==='hh'){d.price.hh=parseCents(el.value);}
    else if(k==='qty'){var q0=parseInt(el.value,10);d.qty=isNaN(q0)||q0<1?1:Math.min(5,q0);}
    else if(k==='a'||k==='b'){d[k]=el.value;}
    else if(k==='offreg'){var o1=parseCents(el.value);d.off=d.off||{};d.off.reg=o1==null?0:o1;}
    else if(k==='offhh'){d.off=d.off||{};d.off.hh=parseCents(el.value);}
  }else if(f==='ditem'){
    var dd=state.deals.filter(function(x){return x.id===id;})[0];if(!dd)return;
    var it=dd.items[parseInt(el.getAttribute('data-i'),10)];if(!it)return;
    if(k==='pid')it.pid=el.value;
    else if(k==='qty'){var q=parseInt(el.value,10);it.qty=isNaN(q)||q<1?1:q;}
  }
  save();
  setTimeout(render,0); // defer so the input's blur finishes before the DOM is replaced
});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js');}catch(e){}}
render();updateStatus();
setInterval(function(){renderBanner();},15000);   // keeps the happy-hour reminder on time
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist().then(function(g){store.persist=g;});}catch(e){}}
// Recovery: if the second copy is newer than what localStorage gave us (or localStorage was wiped), use it.
idbGet('state').then(function(js){
  var s=null;try{s=js?migrate(JSON.parse(js)):null;}catch(e){}
  if(s&&(s.savedAt||0)>(state.savedAt||0)){state=s;render();toast('Recovered your saved data');}
  save();
},function(){save();});
})();
</script>
